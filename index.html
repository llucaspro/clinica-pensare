<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pensare – Clínica de Psicologia e Bem-Estar</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Raleway:wght@200;300;400;500&display=swap" rel="stylesheet"/>

  <style>
  /* ══════════════════════════════════════
     ROOT VARIABLES — DARK LUXURY PALETTE
  ══════════════════════════════════════ */
  :root {
    --black:    #080808;
    --deep:     #0D0D0D;
    --surface:  #141414;
    --panel:    #1A1A1A;
    --border:   rgba(255,255,255,0.07);
    --gold:     #C9A96E;
    --gold2:    #E8D5B0;
    --rose:     #C4867A;
    --white:    #F5F5F0;
    --muted:    rgba(245,245,240,0.45);
    --faint:    rgba(245,245,240,0.12);
    --cursor-size: 12px;
  }

  /* ══ RESET ══ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Raleway', sans-serif;
    background: var(--black);
    color: var(--white);
    font-weight: 300;
    line-height: 1.75;
    overflow-x: hidden;
    cursor: none;
  }

  /* ══ CUSTOM CURSOR ══ */
  #cursor-dot {
    position: fixed; top:0; left:0; z-index:9999;
    width: var(--cursor-size); height: var(--cursor-size);
    background: var(--gold);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%,-50%);
    transition: width .25s, height .25s, opacity .25s;
    mix-blend-mode: difference;
  }
  #cursor-ring {
    position: fixed; top:0; left:0; z-index:9998;
    width: 36px; height: 36px;
    border: 1px solid rgba(201,169,110,0.5);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%,-50%);
    transition: transform .08s ease, width .3s, height .3s, border-color .3s;
  }
  body.hovering #cursor-dot  { width: 6px; height: 6px; opacity: .6; }
  body.hovering #cursor-ring { width: 54px; height: 54px; border-color: var(--gold); }

  /* ══ SCROLLBAR ══ */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--black); }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

  /* ══ NOISE TEXTURE OVERLAY ══ */
  body::before {
    content:'';
    position: fixed; inset:0; z-index:1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: .5;
  }

  /* ══ PAGE LOADER ══ */
  #loader {
    position: fixed; inset:0; z-index:8000;
    background: var(--black);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 1.5rem;
    transition: opacity .8s ease, visibility .8s ease;
  }
  #loader.hidden { opacity:0; visibility:hidden; pointer-events:none; }
  .loader-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 300;
    letter-spacing: 0.35em;
    color: var(--white);
    overflow: hidden;
  }
  .loader-bar-wrap {
    width: 180px; height: 1px;
    background: var(--border);
    position: relative; overflow: hidden;
  }
  .loader-bar {
    position: absolute; top:0; left:-100%; width:100%; height:100%;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: loaderSlide 1.2s ease forwards;
  }
  @keyframes loaderSlide { to { left:100%; } }

  /* ══ NAV ══ */
  nav {
    position: fixed; top:0; left:0; right:0; z-index:500;
    padding: 1.6rem 3rem;
    display: flex; align-items:center; justify-content:space-between;
    transition: background .5s, backdrop-filter .5s, border-bottom .5s;
  }
  nav.scrolled {
    background: rgba(8,8,8,0.92);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo img { height: 52px; filter: brightness(1.1); transition: transform .4s; }
  .nav-logo:hover img { transform: scale(1.05); }

  .nav-links { display:flex; gap:2.8rem; list-style:none; }
  .nav-links a {
    font-size: .72rem; font-weight:400;
    letter-spacing: .22em; text-transform:uppercase;
    color: var(--muted); text-decoration:none;
    position:relative; transition: color .3s;
    cursor: none;
  }
  .nav-links a::after {
    content:''; position:absolute; bottom:-4px; left:0;
    width:0; height:1px; background:var(--gold);
    transition: width .4s ease;
  }
  .nav-links a:hover { color:var(--gold); }
  .nav-links a:hover::after { width:100%; }

  /* ══ HAMBURGER ══ */
  .hamburger { display:none; flex-direction:column; gap:6px; cursor:none; padding:4px; z-index:600; }
  .hamburger span { display:block; width:26px; height:1px; background:var(--white); transition:all .35s; }
  .hamburger.open span:nth-child(1) { transform:rotate(45deg) translate(5px,5px); }
  .hamburger.open span:nth-child(2) { opacity:0; transform:translateX(10px); }
  .hamburger.open span:nth-child(3) { transform:rotate(-45deg) translate(5px,-5px); }

  /* ══ HERO ══ */
  #hero {
    min-height: 100vh;
    display:flex; align-items:center;
    padding: 8rem 3rem 5rem;
    position:relative; overflow:hidden;
    background: var(--black);
  }

  /* Animated gradient orbs */
  .orb {
    position:absolute; border-radius:50%;
    filter: blur(80px); opacity:.18;
    pointer-events:none;
    animation: orbFloat 12s ease-in-out infinite;
  }
  .orb-1 { width:500px; height:500px; background:var(--gold); top:-10%; right:-5%; animation-delay:0s; }
  .orb-2 { width:350px; height:350px; background:var(--rose); bottom:-5%; left:-5%; animation-delay:-5s; }
  .orb-3 { width:280px; height:280px; background:#6A8CAF; top:40%; left:30%; animation-delay:-9s; opacity:.08; }
  @keyframes orbFloat {
    0%,100% { transform: translate(0,0) scale(1); }
    33%      { transform: translate(30px,-40px) scale(1.05); }
    66%      { transform: translate(-20px,25px) scale(.97); }
  }

  /* Grid lines overlay */
  .grid-lines {
    position:absolute; inset:0; pointer-events:none; opacity:.035;
    background-image:
      linear-gradient(var(--white) 1px, transparent 1px),
      linear-gradient(90deg, var(--white) 1px, transparent 1px);
    background-size: 80px 80px;
  }

  /* Animated border line top */
  .hero-line {
    position:absolute; top:0; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: lineGlow 4s ease-in-out infinite;
  }
  @keyframes lineGlow {
    0%,100% { opacity:.4; } 50% { opacity:1; }
  }

  .hero-inner {
    max-width:1200px; margin:0 auto;
    display:grid; grid-template-columns:1fr 1fr;
    gap:5rem; align-items:center; width:100%;
    position:relative; z-index:2;
  }

  /* Stagger reveal animation */
  .reveal { opacity:0; transform:translateY(30px); }
  .reveal.visible {
    animation: revealUp .9s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes revealUp {
    to { opacity:1; transform:translateY(0); }
  }

  .hero-eyebrow {
    display:inline-flex; align-items:center; gap:.8rem;
    font-size:.68rem; letter-spacing:.35em; text-transform:uppercase;
    color:var(--gold); margin-bottom:1.6rem;
  }
  .hero-eyebrow::before {
    content:''; display:block; width:28px; height:1px; background:var(--gold);
  }

  .hero-heading {
    font-family:'Playfair Display', serif;
    font-size: clamp(2.6rem, 4.8vw, 4.2rem);
    font-weight:300; line-height:1.15;
    color:var(--white); margin-bottom:1.8rem;
  }
  .hero-heading em {
    font-style:italic; color:var(--gold);
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .hero-heading .line { display:block; overflow:hidden; }
  .hero-heading .line span {
    display:block;
    animation: lineSlideUp .9s cubic-bezier(.22,1,.36,1) both;
  }
  .hero-heading .line:nth-child(1) span { animation-delay:.3s; }
  .hero-heading .line:nth-child(2) span { animation-delay:.45s; }
  .hero-heading .line:nth-child(3) span { animation-delay:.6s; }
  @keyframes lineSlideUp {
    from { transform:translateY(110%); opacity:0; }
    to   { transform:translateY(0);    opacity:1; }
  }

  .hero-sub {
    font-size:.98rem; color:var(--muted);
    max-width:440px; margin-bottom:3rem; line-height:1.9;
    animation: fadeIn 1s ease .9s both;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  /* CTA Button */
  .btn-cta {
    display:inline-flex; align-items:center; gap:.9rem;
    position:relative; overflow:hidden;
    padding:1.1rem 2.4rem;
    border:1px solid var(--gold);
    color:var(--white); text-decoration:none;
    font-size:.78rem; font-weight:500;
    letter-spacing:.2em; text-transform:uppercase;
    cursor:none;
    transition: color .4s;
    animation: fadeIn 1s ease 1.1s both;
  }
  .btn-cta::before {
    content:''; position:absolute; inset:0;
    background:var(--gold);
    transform:translateX(-101%);
    transition: transform .45s cubic-bezier(.22,1,.36,1);
    z-index:-1;
  }
  .btn-cta:hover { color:var(--black); }
  .btn-cta:hover::before { transform:translateX(0); }
  .btn-cta svg { width:18px; height:18px; fill:currentColor; flex-shrink:0; }

  /* Hero logo */
  .hero-visual {
    display:flex; align-items:center; justify-content:center;
    position:relative;
    animation: fadeIn 1.2s ease .4s both;
  }
  .logo-frame {
    position:relative; width:460px; height:460px;
    display:flex; align-items:center; justify-content:center;
  }
  .logo-frame::before {
    content:''; position:absolute; inset:0; border-radius:50%;
    background: conic-gradient(from 0deg, transparent 70%, rgba(201,169,110,.6) 85%, transparent 100%);
    animation: spinBorder 8s linear infinite;
  }
  @keyframes spinBorder { to { transform:rotate(360deg); } }
  .logo-frame::after {
    content:''; position:absolute; inset:6px; border-radius:50%;
    background: conic-gradient(from 180deg, transparent 70%, rgba(196,134,122,.4) 85%, transparent 100%);
    animation: spinBorder 12s linear infinite reverse;
  }
  .logo-inner {
    position:relative; z-index:2;
    width:88%; height:88%; border-radius:50%;
    background:var(--surface);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    animation: floatY 6s ease-in-out infinite;
    box-shadow:
      0 0 60px rgba(201,169,110,.08),
      0 30px 80px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.06);
  }
  .logo-inner img { width:76%; filter:brightness(1.05); }
  @keyframes floatY {
    0%,100% { transform:translateY(0); }
    50%      { transform:translateY(-14px); }
  }

  /* Floating particles */
  .particles { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .particle {
    position:absolute; border-radius:50%;
    background:var(--gold); opacity:0;
    animation: particleAnim linear infinite;
  }
  @keyframes particleAnim {
    0%   { opacity:0; transform:translateY(0) scale(0); }
    10%  { opacity:.6; transform:scale(1); }
    90%  { opacity:.3; }
    100% { opacity:0; transform:translateY(-120px) scale(.3); }
  }

  /* ══ SECTION SHARED ══ */
  .section-tag {
    display:inline-flex; align-items:center; gap:.7rem;
    font-size:.65rem; letter-spacing:.35em; text-transform:uppercase;
    color:var(--gold); margin-bottom:1.4rem;
  }
  .section-tag::before { content:''; width:20px; height:1px; background:var(--gold); }

  .gold-line {
    width:40px; height:1px;
    background:linear-gradient(90deg,var(--gold),transparent);
    margin: 1.2rem 0 1.8rem;
  }
  .gold-line--center { margin:1.2rem auto 1.8rem; background:linear-gradient(90deg,transparent,var(--gold),transparent); width:80px; }

  /* ══ SOBRE ══ */
  #sobre {
    padding:9rem 3rem;
    background:var(--deep);
    position:relative; overflow:hidden;
  }
  #sobre::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,var(--border),transparent);
  }
  #sobre::after {
    content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,var(--border),transparent);
  }

  .sobre-grid {
    max-width:1100px; margin:0 auto;
    display:grid; grid-template-columns:1fr 1fr;
    gap:6rem; align-items:center;
  }
  .sobre-left .section-tag {}
  .sobre-heading {
    font-family:'Playfair Display',serif;
    font-size: clamp(2rem,3.5vw,3rem);
    font-weight:300; line-height:1.25;
    color:var(--white);
  }
  .sobre-heading em { font-style:italic; color:var(--gold); }
  .sobre-text {
    font-size:.95rem; color:var(--muted);
    line-height:1.95; margin-top:1.4rem;
  }

  .sobre-right { display:flex; flex-direction:column; gap:1.2rem; }
  .pillar-card {
    background:var(--surface);
    border:1px solid var(--border);
    padding:1.6rem 1.8rem;
    display:flex; align-items:flex-start; gap:1.2rem;
    position:relative; overflow:hidden;
    transition:border-color .4s, transform .4s, box-shadow .4s;
    cursor:none;
  }
  .pillar-card::before {
    content:''; position:absolute; bottom:0; left:0;
    width:0; height:1px; background:var(--gold);
    transition:width .5s ease;
  }
  .pillar-card:hover { border-color:rgba(201,169,110,.3); transform:translateX(6px); box-shadow:0 8px 40px rgba(0,0,0,.4); }
  .pillar-card:hover::before { width:100%; }
  .pillar-icon {
    width:42px; height:42px; flex-shrink:0;
    background:var(--faint); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .pillar-icon svg { width:20px; height:20px; stroke:var(--gold); fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
  .pillar-card h4 {
    font-family:'Playfair Display',serif;
    font-size:1rem; font-weight:400; color:var(--white); margin-bottom:.3rem;
  }
  .pillar-card p { font-size:.82rem; color:var(--muted); line-height:1.7; }

  /* ══ ESPECIALIDADES ══ */
  #especialidades {
    padding:9rem 3rem;
    background:var(--black);
    position:relative; overflow:hidden;
  }
  .esp-header { text-align:center; margin-bottom:5rem; }
  .esp-heading {
    font-family:'Playfair Display',serif;
    font-size: clamp(2rem,3.5vw,3rem);
    font-weight:300; color:var(--white); line-height:1.3;
  }
  .esp-heading em { font-style:italic; color:var(--gold); }

  .esp-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:1px;
    max-width:1200px; margin:0 auto;
    border:1px solid var(--border);
  }

  .esp-card {
    background:var(--surface);
    padding:2.4rem 2.2rem;
    display:flex; flex-direction:column; gap:.9rem;
    border:1px solid transparent;
    position:relative; overflow:hidden;
    transition:background .4s, border-color .4s, transform .4s;
    cursor:none;
  }
  /* Shimmer on hover */
  .esp-card::before {
    content:''; position:absolute; top:-50%; left:-60%;
    width:40%; height:200%;
    background:linear-gradient(105deg,transparent,rgba(201,169,110,.06),transparent);
    transition:left .6s ease;
  }
  .esp-card:hover { background:var(--panel); border-color:rgba(201,169,110,.18); transform:scale(1.01); }
  .esp-card:hover::before { left:120%; }

  .esp-card-num {
    font-size:.65rem; letter-spacing:.25em;
    color:rgba(201,169,110,.4); font-weight:400;
    margin-bottom:.4rem;
  }
  .esp-icon {
    width:50px; height:50px;
    border:1px solid var(--border);
    background:var(--faint);
    display:flex; align-items:center; justify-content:center;
    transition:background .4s, border-color .4s;
  }
  .esp-card:hover .esp-icon { background:rgba(201,169,110,.08); border-color:rgba(201,169,110,.3); }
  .esp-icon svg { width:22px; height:22px; stroke:var(--gold); fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
  .esp-title {
    font-family:'Playfair Display',serif;
    font-size:1.25rem; font-weight:400; color:var(--white);
  }
  .esp-desc { font-size:.86rem; color:var(--muted); line-height:1.8; flex:1; }
  .esp-cta {
    display:inline-flex; align-items:center; gap:.5rem;
    font-size:.7rem; letter-spacing:.18em; text-transform:uppercase;
    color:var(--gold); text-decoration:none; margin-top:.6rem;
    transition:gap .35s, opacity .35s;
    cursor:none; opacity:.7;
  }
  .esp-card:hover .esp-cta { gap:.9rem; opacity:1; }

  /* ══ MARQUEE STRIP ══ */
  .marquee-strip {
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    background:var(--surface);
    padding:.9rem 0; overflow:hidden;
    white-space:nowrap;
  }
  .marquee-track {
    display:inline-flex; gap:0;
    animation:marquee 20s linear infinite;
  }
  .marquee-track:hover { animation-play-state:paused; }
  .marquee-item {
    display:inline-flex; align-items:center; gap:1.5rem;
    padding:0 2.5rem;
    font-size:.68rem; letter-spacing:.25em; text-transform:uppercase;
    color:var(--muted);
  }
  .marquee-item span.dot { color:var(--gold); font-size:1rem; }
  @keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }

  /* ══ CONTATO ══ */
  #contato {
    padding:9rem 3rem;
    background:var(--deep);
    position:relative; overflow:hidden;
  }
  #contato .bg-text {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-family:'Playfair Display',serif;
    font-size:clamp(8rem,18vw,16rem);
    font-weight:700; color:transparent;
    -webkit-text-stroke:1px rgba(255,255,255,.03);
    pointer-events:none; white-space:nowrap;
    user-select:none;
  }

  .contato-inner { max-width:800px; margin:0 auto; text-align:center; position:relative; z-index:2; }
  .contato-heading {
    font-family:'Playfair Display',serif;
    font-size:clamp(2.2rem,4vw,3.4rem);
    font-weight:300; color:var(--white); line-height:1.25;
    margin-bottom:1rem;
  }
  .contato-heading em { font-style:italic; color:var(--gold); }
  .contato-sub { font-size:.95rem; color:var(--muted); margin-bottom:3.5rem; }

  .address-card {
    display:inline-flex; align-items:flex-start; gap:1.2rem;
    background:var(--surface);
    border:1px solid var(--border);
    padding:2rem 2.6rem; margin-bottom:3.5rem;
    text-align:left;
    position:relative; overflow:hidden;
    transition:border-color .4s;
    cursor:none;
  }
  .address-card::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg,rgba(201,169,110,.04),transparent);
    pointer-events:none;
  }
  .address-card:hover { border-color:rgba(201,169,110,.3); }
  .address-card svg { width:22px; height:22px; stroke:var(--gold); fill:none; stroke-width:1.4; flex-shrink:0; margin-top:3px; }
  .address-card strong {
    display:block; font-size:.68rem; letter-spacing:.2em;
    text-transform:uppercase; color:var(--gold); margin-bottom:.5rem; font-weight:400;
  }
  .address-card p { font-size:.93rem; color:var(--muted); line-height:1.75; }

  .contato-btns { display:flex; gap:1.4rem; justify-content:center; flex-wrap:wrap; }

  .btn-wa {
    display:inline-flex; align-items:center; gap:.8rem;
    padding:1.1rem 2.4rem;
    background:#25D366; color:var(--black);
    font-size:.78rem; font-weight:500;
    letter-spacing:.18em; text-transform:uppercase;
    text-decoration:none;
    position:relative; overflow:hidden;
    transition:transform .3s, box-shadow .3s;
    cursor:none;
  }
  .btn-wa:hover { transform:translateY(-3px); box-shadow:0 14px 40px rgba(37,211,102,.35); }
  .btn-wa svg { width:18px; height:18px; fill:currentColor; }

  .btn-ig {
    display:inline-flex; align-items:center; gap:.8rem;
    padding:1.1rem 2.4rem;
    background:transparent; color:var(--white);
    border:1px solid var(--border);
    font-size:.78rem; font-weight:400;
    letter-spacing:.18em; text-transform:uppercase;
    text-decorat
